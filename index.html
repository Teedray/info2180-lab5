<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>World Database Lookup</title>

		<!-- you can modify this as needed or to your preference -->
		<link href="world.css" type="text/css" rel="stylesheet" />

		<!-- you write this -->
		<script src="world.js" defer></script>
	</head>

	<body>
		<header>
			<div class="header-content">
				<span class="globe" aria-hidden="true">🌍</span>
				<h1>World Database Lookup</h1>
			</div>
		</header>

		<main>
			<div id="controls">
				<label for="country">Country:</label>

				<input
					id="country"
					type="search"
					name="country"
					placeholder="Enter country name"
				>

				<div class="buttons">
					<button id="lookup" type="button">Lookup Country</button>
					<button id="lookup-cities" type="button">Lookup Cities</button>
				</div>
			</div>
			
			<div id="result">
				<!-- countries will appear here -->
			</div>
		</main>

	</body>
</html>
